[project]
name = "tracemark-api"
version = "0.1.0"
description = "TraceMark forensic image watermarking API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=23.1,<26",
  "dramatiq[redis]>=1.18,<2",
  "fastapi>=0.116,<1",
  "minio>=7.2,<8",
  "pillow>=11,<13",
  "reportlab>=4.4,<5",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "redis>=6,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracemark_api"]

