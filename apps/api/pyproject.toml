[project]
name = "tracemark-api"
version = "0.1.0"
description = "TraceMark forensic image watermarking API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "pillow>=11,<14",
  "reportlab>=4.4,<5",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1.1,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracemark_api"]
