name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: python -m pip install -r requirements.txt -e './packages/watermark_engine[test,forensics]' -e './apps/api[dev]'
      - run: pnpm install --frozen-lockfile
      - run: make lint
      - run: make test
      - run: make benchmark
      - run: make restart
      - run: pnpm --dir apps/web build
      - run: pnpm audit --audit-level moderate
      - run: python -m pip_audit -r requirements.txt --no-deps --disable-pip
      - run: python -m pip check
      - run: python -m bandit -r apps/api/tracemark_api packages/watermark_engine/src scripts -q
      - run: python -m compileall -q apps packages scripts
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: pnpm --dir apps/web e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-browser-evidence
          path: |
            apps/web/playwright-report
            docs/screenshots
            artifacts/benchmark-results.json
