user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_max_body_size 25m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    upstream api_upstream { server api:8000; }
    upstream web_upstream { server web:80; }

    server {
        listen 8080;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_pass http://api_upstream;
        }

        location / {
            proxy_set_header Host $host;
            proxy_pass http://web_upstream;
        }
    }
}
